name: Release

# Releases are cut by "milestone" commits on master. Push a commit whose message
# starts with `milestone:` and matches the version in package.json, e.g.
# `milestone: Splicedd v3.0.0`, and this workflow builds the extension, attaches
# a build-provenance attestation, and opens a *draft* release with the packaged
# zip for you to write the changelog and publish manually.
on:
  push:
    branches: [master]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap guard: every push to master runs this, but only milestone commits
  # proceed to the build below.
  gate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags to detect an already-released version

      - id: check
        shell: bash
        run: |
          MSG="$(git log -1 --pretty=%s)"
          echo "Head commit: $MSG"

          if [[ "$MSG" != milestone:* ]]; then
            echo "Not a milestone commit -- skipping release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"

          if [[ "$MSG" != *"$TAG"* ]]; then
            echo "::error::the commit says '$MSG' but package.json is at $VERSION."
            exit 1
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG has already been released."
            exit 1
          fi

          echo "Releasing $TAG."
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn build

      - name: Package the extension
        run: cd dist && zip -qr "../splicedd-${{ needs.gate.outputs.tag }}-chrome.zip" .

      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: splicedd-${{ needs.gate.outputs.tag }}-chrome.zip

      - name: Open a draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          name: Splicedd ${{ needs.gate.outputs.tag }}
          draft: true
          files: splicedd-${{ needs.gate.outputs.tag }}-chrome.zip
          body: |
            Unzip and load the folder through `chrome://extensions` -> Developer mode -> Load unpacked.
